[project]
name = "rca-investigation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pyyaml", "requests", "neo4j", "gymnasium"]

[project.scripts]
rca-investigate = "rca_investigation.cli:main"

[project.optional-dependencies]
explain = ["google-generativeai", "groq", "python-dotenv"]
legacy = ["langchain-community", "langchain-neo4j", "ragas", "datasets", "rich"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_investigation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
